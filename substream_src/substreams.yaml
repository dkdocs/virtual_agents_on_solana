specVersion: v0.1.0
package:
  name: "solana_explorer"
  version: v0.2.1
  url: https://github.com/streamingfast/substreams-explorers/
  image: ./solana.png
  doc: |
    This package holds simple modules to allow you to explore the Solana data model.

network: solana

imports:
  solana: https://github.com/streamingfast/firehose-solana/releases/download/v0.1.1/solana-v0.1.1.spkg

protobuf:
  files:
    - block.proto
    - transactions.proto
    - solana-token-tracker.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

modules:
  - name: map_filter_transactions
    initialBlock: 319903923
    kind: map
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:sol.transactions.v1.Transactions
    doc: |
      `map_filter_transactions` allows you to get all transactions containing the program ID `5U3EU2ubXtK84QcRjWVmYt9RaDyA8gKxdUrPFXmZyaki`.

  - name: map_solana_token_events
    kind: map
    initialBlock: 319903923
    inputs:
      - params: string
      - source: sf.solana.type.v1.Block
      # - store: store_tokens_created
      #   mode: deltas
    output:
      type: proto:solana_token_tracker.types.v1.Output    

  - name: db_out
    initialBlock: 319903923
    kind: map
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  - name: map_block_without_votes
    kind: map
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:sf.solana.type.v1.Block    