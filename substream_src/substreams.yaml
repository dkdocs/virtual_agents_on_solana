specVersion: v0.1.0
package:
  name: "solana_explorer"
  version: v0.2.1
  url: https://github.com/streamingfast/substreams-explorers/
  image: ./solana.png
  doc: |
    This package holds simple modules to allow you to explore the Solana data model.

network: solana

imports:
  sol: https://spkg.io/streamingfast/solana-common-v0.3.0.spkg

protobuf:
  files:
    - block.proto
    - transactions_v1.proto
    - solana-token-tracker.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/substreams.wasm

modules:
  - name: map_filter_transactions
    kind: map
    initialBlock: 319903923
    inputs:
      - map: sol:blocks_without_votes
    output:
      type: proto:solana.transactions.v1.CreatedTokens

  - name: store_created_tokens
    kind: store
    initialBlock: 319903923
    inputs:
      - source: sf.solana.type.v1.Block
      - map: map_filter_transactions
    updatePolicy: set
    valueType: int64

  - name: map_solana_token_events
    kind: map
    initialBlock: 319903923
    inputs:
      - source: sol:blocks_without_votes
      - store: store_created_tokens
        mode: get
    output:
      type: proto:solana_token_tracker.types.v1.Output    

  - name: db_out
    kind: map
    initialBlock: 319903923
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

  - name: map_block_without_votes
    kind: map
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:sf.solana.type.v1.Block

