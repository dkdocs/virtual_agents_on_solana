[package]
name = "substreams-solana-explorer"
version = "0.1.0"
description = "Substreams showcasing the building blocks of Solana"
edition = "2021"
repository = "https://github.com/streamingfast/substreams-explorers"
license = "Apache 2.0"

[lib]
name = "substreams"
crate-type = ["cdylib"]

[dependencies]
bs58 = "0.4"
hex = "0.4"
serde_json = "1.0"
substreams-database-change = "1.2.0"
hex-literal = "0.3"
num-bigint = "0.4"
prost = "0.11"
# Use latest from https://crates.io/crates/substreams
substreams = "0.5"
# Use latest from https://crates.io/crates/substreams-solana
substreams-solana = { git = "https://github.com/streamingfast/substreams-solana", branch = "master"}
substreams-solana-program-instructions = "0.1"
serde_qs = "0.12.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
# Enable parallel code generation
codegen-units = 1
# Enable panic=abort to remove panic unwinding code
panic = "abort"
# Enable incremental compilation for faster rebuilds
incremental = true
# Enable overflow checks in release mode
overflow-checks = true
# Enable debug assertions in release mode
debug-assertions = false
# Enable runtime checks
debug = false
